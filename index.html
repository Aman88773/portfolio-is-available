<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clina Hub">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="manifest" href="./manifest.json">
  <title>Clina 4-Robots Hub</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --surface: #12151d;
      --surface-raised: #181c26;
      --surface-soft: #1d222e;
      --line: #282e3a;
      --text: #f3f5fa;
      --muted: #929bad;
      --subtle: #687184;
      --accent: #c4a16a;
      --green: #64d6a5;
      --red: #f18188;
      --blue: #86a9ff;
      --radius: 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(ellipse at 82% -10%, rgba(80, 68, 109, .20), transparent 38rem),
        radial-gradient(ellipse at -14% 34%, rgba(82, 105, 117, .11), transparent 34rem),
        var(--bg);
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid #d6bd91;
      outline-offset: 3px;
    }
    .shell { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 22px 0 56px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark {
      display: grid; width: 42px; height: 42px; place-items: center; flex: 0 0 auto;
      border: 1px solid #54483a; border-radius: 14px; color: #e8c990;
      background: linear-gradient(145deg, #30291f, #191a1d);
    }
    .brand-mark svg { width: 25px; height: 25px; }
    .brand-name { font-size: 15px; font-weight: 780; letter-spacing: -.025em; }
    .brand-caption { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .top-actions { display: flex; align-items: center; gap: 9px; }
    .language-switch { display: flex; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    .language-switch button {
      min-width: 39px; min-height: 34px; padding: 0 8px; border: 0; border-radius: 8px;
      color: var(--muted); background: transparent; font-size: 11px; font-weight: 800; cursor: pointer;
    }
    .language-switch button[aria-pressed="true"] { color: #f2dfbd; background: #30291f; }
    .icon-button, .button {
      min-height: 42px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--surface-raised); color: var(--text); padding: 9px 13px;
      font-size: 12px; font-weight: 720; cursor: pointer; transition: background .15s, border-color .15s, transform .15s;
    }
    .icon-button:hover, .button:hover { border-color: #4a5262; background: #222733; }
    .button:active, .icon-button:active { transform: translateY(1px); }
    .button.primary { border-color: #b08d58; color: #17130e; background: #d3b27e; }
    .button.primary:hover { background: #e2c491; }
    .button.danger { border-color: #5e3237; color: #ffc0c2; background: #2b191e; }
    .button.subtle { background: transparent; }
    .button.small { min-height: 34px; padding: 7px 10px; font-size: 11px; }
    .button:disabled { cursor: not-allowed; opacity: .45; }
    .intro { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 18px; }
    .eyebrow { color: var(--accent); font-size: 10px; font-weight: 850; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 5px 0 0; font-size: clamp(24px, 5vw, 34px); letter-spacing: -.045em; line-height: 1.12; }
    .intro-note { color: var(--muted); font-size: 12px; }
    .greeting {
      display: flex; align-items: center; gap: 14px; margin-bottom: 18px; padding: 16px;
      border: 1px solid #3c3327; border-radius: var(--radius);
      background: linear-gradient(110deg, rgba(91, 70, 43, .22), rgba(20, 23, 30, .88) 65%);
    }
    .greeting-icon { display: grid; width: 43px; height: 43px; flex: 0 0 auto; place-items: center; border-radius: 14px; background: #322a20; }
    .greeting-icon svg { width: 25px; height: 25px; }
    .greeting-label { margin-bottom: 4px; color: #d6b982; font-size: 10px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .greeting p { margin: 0; color: #e9e9eb; font-size: 13px; line-height: 1.5; }
    .robot-nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; margin-bottom: 18px; }
    .robot-tab {
      display: flex; min-width: 0; min-height: 70px; align-items: center; gap: 10px; padding: 11px;
      border: 1px solid var(--line); border-radius: 15px; background: rgba(18, 21, 29, .86);
      text-align: left; cursor: pointer; transition: border-color .18s, background .18s, transform .18s;
    }
    .robot-tab:hover { transform: translateY(-1px); border-color: #444c59; }
    .robot-tab[aria-current="page"] { border-color: var(--robot-color); background: color-mix(in srgb, var(--robot-color) 9%, #141720); }
    .robot-icon { display: grid; width: 42px; height: 42px; flex: 0 0 auto; place-items: center; border: 1px solid color-mix(in srgb, var(--robot-color) 32%, transparent); border-radius: 13px; color: var(--robot-color); background: color-mix(in srgb, var(--robot-color) 10%, #141720); }
    .robot-icon svg { width: 26px; height: 26px; }
    .tab-copy { min-width: 0; }
    .tab-copy strong { display: block; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .tab-copy span { display: flex; align-items: center; gap: 6px; margin-top: 5px; color: var(--muted); font-size: 10px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 9px rgba(100, 214, 165, .42); }
    .main-panel { min-height: 480px; }
    .workspace-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 15px; }
    .workspace-title { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .workspace-title h2 { margin: 0; font-size: 18px; letter-spacing: -.025em; }
    .workspace-title p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: #151821; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .badge.pending { border-color: #604c2f; color: #e3c18d; background: #2b241b; }
    .badge.success { border-color: #295841; color: #8de0b7; background: #15241d; }
    .grid { display: grid; gap: 13px; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .card { min-width: 0; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(145deg, rgba(24, 28, 38, .94), rgba(17, 20, 28, .96)); }
    .card h3 { margin: 0; font-size: 13px; letter-spacing: -.01em; }
    .card > p, .card-copy { margin: 7px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .card-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 13px; }
    .section-label { margin: 0 0 9px; color: var(--subtle); font-size: 9px; font-weight: 850; letter-spacing: .13em; text-transform: uppercase; }
    .field { display: grid; gap: 6px; margin-bottom: 12px; }
    .field label { color: #cdd2dd; font-size: 11px; font-weight: 700; }
    input, select, textarea {
      width: 100%; min-height: 42px; padding: 10px 11px; border: 1px solid #303645; border-radius: 11px;
      color: var(--text); background: #0f1219; font-size: 12px;
    }
    textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
    input::placeholder, textarea::placeholder { color: #697285; }
    select { cursor: pointer; }
    .form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .inline-form { display: flex; align-items: center; gap: 8px; }
    .inline-form > input { flex: 1; }
    .status-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .status-card { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 11px 9px; border: 1px solid var(--line); border-radius: 13px; background: #141821; }
    .status-card .robot-icon { width: 34px; height: 34px; border-radius: 11px; }
    .status-card .robot-icon svg { width: 21px; height: 21px; }
    .status-card strong { display: block; overflow: hidden; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .status-card span { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; }
    .list { display: grid; gap: 8px; }
    .empty { padding: 19px 12px; border: 1px dashed #303644; border-radius: 13px; color: var(--muted); text-align: center; font-size: 11px; line-height: 1.5; }
    .task-item, .approval-item, .activity-item { padding: 12px; border: 1px solid var(--line); border-radius: 13px; background: #141821; }
    .task-top, .approval-top { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
    .task-item strong, .approval-item strong { font-size: 11px; line-height: 1.45; }
    .task-meta { margin-top: 5px; color: var(--muted); font-size: 10px; }
    .activity-item { display: grid; grid-template-columns: 8px 1fr; gap: 9px; }
    .activity-item:before { content: ""; width: 6px; height: 6px; margin-top: 4px; border-radius: 50%; background: var(--accent); }
    .activity-copy { color: #d7dbe3; font-size: 10px; line-height: 1.45; }
    .activity-copy small { display: block; margin-top: 4px; color: var(--subtle); font-size: 9px; }
    .checklist { display: grid; gap: 8px; }
    .check-row { display: flex; align-items: flex-start; gap: 9px; padding: 9px 10px; border: 1px solid #292f3b; border-radius: 11px; background: #131720; cursor: pointer; }
    .check-row input { width: 15px; min-height: 15px; height: 15px; margin: 1px 0 0; accent-color: #c3a16c; }
    .check-row span { color: #cbd1dc; font-size: 10px; line-height: 1.45; }
    .check-row input:checked + span { color: var(--green); }
    .output-grid { display: grid; gap: 9px; margin-top: 14px; }
    .output-block { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #10131a; }
    .output-block strong { display: block; margin-bottom: 6px; color: #d3b27e; font-size: 10px; }
    .output-block p { margin: 0; color: #d8dce4; font-size: 11px; line-height: 1.55; white-space: pre-wrap; }
    .safety-note { padding: 10px 11px; border: 1px solid #51432d; border-radius: 11px; color: #ddc69f; background: #241f18; font-size: 10px; line-height: 1.5; }
    .notice { margin-bottom: 12px; padding: 11px 12px; border: 1px solid #5b3738; border-radius: 12px; color: #ffc5c5; background: #291a1c; font-size: 11px; line-height: 1.5; }
    .toast { position: fixed; z-index: 20; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); width: min(380px, calc(100% - 32px)); padding: 12px 14px; border: 1px solid #51432d; border-radius: 13px; color: #f2dfbd; background: #201d19; box-shadow: 0 14px 40px #0008; font-size: 11px; line-height: 1.5; }
    .footer { margin-top: 18px; color: var(--subtle); font-size: 10px; text-align: center; }
    .projects { margin-top: 38px; padding-top: 27px; border-top: 1px solid var(--line); }
    .projects-heading { margin-bottom: 15px; }
    .projects-heading h2 { margin: 5px 0 0; font-size: 21px; letter-spacing: -.03em; }
    .projects-heading p { margin: 7px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .projects-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .project-card { display: flex; min-width: 0; flex-direction: column; padding: 15px; border: 1px solid var(--line); border-radius: 15px; background: linear-gradient(145deg, rgba(24, 28, 38, .94), rgba(17, 20, 28, .96)); }
    .project-card-icon { display: grid; width: 38px; height: 38px; margin-bottom: 12px; place-items: center; border: 1px solid #363d4a; border-radius: 12px; background: #1b2029; font-size: 18px; }
    .project-card h3 { margin: 0; font-size: 13px; }
    .project-card p { flex: 1; margin: 7px 0 13px; color: var(--muted); font-size: 10px; line-height: 1.55; }
    .project-link { display: inline-flex; min-height: 37px; align-items: center; justify-content: center; border: 1px solid #414958; border-radius: 10px; color: #e7d2ab; background: #201e1a; font-size: 10px; font-weight: 750; text-align: center; text-decoration: none; }
    .project-link:hover { border-color: #9c8057; background: #29251f; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 760px) {
      .shell { width: min(100% - 24px, 580px); padding-top: max(14px, env(safe-area-inset-top)); }
      .topbar { align-items: flex-start; margin-bottom: 20px; }
      .brand-name { font-size: 13px; }
      .brand-caption { font-size: 10px; }
      .top-actions { gap: 6px; }
      .language-switch button { min-width: 34px; padding: 0 6px; }
      .reset-button { width: 40px; padding: 0; overflow: hidden; font-size: 0; }
      .reset-button::before { content: "↻"; font-size: 20px; }
      .intro { display: block; margin-bottom: 13px; }
      .intro-note { margin-top: 7px; }
      .greeting { align-items: flex-start; padding: 13px; }
      .robot-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
      .robot-tab { min-height: 64px; padding: 9px; gap: 8px; }
      .robot-icon { width: 37px; height: 37px; }
      .tab-copy strong { font-size: 10px; }
      .grid.two, .grid.three { grid-template-columns: 1fr; }
      .status-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .projects-grid { grid-template-columns: 1fr; }
      .projects { margin-top: 30px; padding-top: 22px; }
      .main-panel { min-height: 400px; }
      .workspace-head { align-items: flex-start; }
      .workspace-title h2 { font-size: 16px; }
      .form-row { gap: 8px; }
      .card { padding: 14px; }
    }
    @media (max-width: 390px) {
      .shell { width: calc(100% - 20px); }
      .brand { gap: 8px; }
      .brand-mark { width: 36px; height: 36px; }
      .brand-name { font-size: 11px; }
      .brand-caption { font-size: 9px; }
      .robot-tab { gap: 7px; }
      .robot-icon { width: 33px; height: 33px; }
      .tab-copy strong { font-size: 9px; }
      .tab-copy span { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>

  <div class="shell">

          <div class="project-card-icon" aria-hidden="true">🧮</div>

          <a class="project-link" href="./tools.html#tariffCalculator" data-i18n="openProject"></a>
        </article>
        <article class="project-card">
          <div class="project-card-icon" aria-hidden="true">🧰</div>

          <a class="project-link" href="./tools.html" data-i18n="openProject"></a>
        </article>
      </div>
    </section>
  </div>

    const secretPatterns = [
      /(?:^|[^\p{L}\p{N}_])(?:password|passwd|passcode|пароль|құпиясөз)\s*(?:[:=]|\bis\b|\s+)\s*(?:"[^"]*"|'[^']*'|[^\s,;]+)/giu,
      /(?:^|[^\p{L}\p{N}_])(?:api[\s_-]?(?:key|token)|access[\s_-]?token|refresh[\s_-]?token|token|secret|токен|кілт)\s*(?:[:=]|\bis\b|\s+)\s*(?:"[^"]*"|'[^']*'|[^\s,;]+)/giu,
      /\b(?:sk-[A-Za-z0-9_-]{12,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[A-Z0-9]{16})\b/g,
      /\b(?:\d[ -]*?){8,34}\b/g,
      /\bBearer\s+[A-Za-z0-9._~+/-]+=*/giu,
      /\b(?:eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{8,})\b/g,
      /\b[A-Z]{2}\d{2}(?:[\s-]?[A-Z0-9]){11,30}\b/gi,
      /-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----[\s\S]+?-----END (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/g
    ];
    function containsSensitive(value) {
      const text = String(value || "");
      if (secretPatterns.some(pattern => { pattern.lastIndex = 0; return pattern.test(text); })) return true;
      return false;
    }
    function redact(value) {
      let safe = String(value || "");
      for (const pattern of secretPatterns) {
        pattern.lastIndex = 0;
        safe = safe.replace(pattern, "[redacted]");
      }
      return safe.slice(0, 600);
    }
    function approvalReasonFor(text) {
      if (/\b(?:pay(?:ment)?s?|billing|invoice|charge|subscription)\b|төлем|шот|оплат[а-я]*|плат[её]ж[а-я]*|сч[её]т|биллинг/iu.test(text)) return "billing";
      if (/\b(?:publish(?:ing)?|post(?:ing)?|store submission|release to store|account)\b|жариялау|жарияла|тіркелгі|аккаунт|публик[а-я]*/iu.test(text)) return "publish";
      if (/\b(?:delete|deletion|remove|overwrite|replace all|drop table|destructive)\b|жою|өшір|қайта жаз|толық ауыстыр|удалить|удаление|перезапис|заменить весь/iu.test(text)) return "destructive";
      return "";

    function routeFor(text, choice = "auto") {
      if (choice !== "auto") return choice;
      if (/\b(?:store|release|security|privacy|app store|google play)\b|дүкен|релиз|қауіпсіздік|магазин|публик[а-я]*/iu.test(text)) return "release";
      if (/\b(?:video|youtube|tiktok|script|story)\b|контент|видео|сценар[а-я]*/iu.test(text)) return "legend";
      return "apps";
    }
    function newTask(text, robot, forcedReason = "") {
      const wasRedacted = containsSensitive(text);
      const safeText = redact(text).trim();
      const reason = forcedReason || approvalReasonFor(text);
      const id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const task = { id, text: safeText, robot, status: reason ? "pending" : "routed", createdAt: new Date().toISOString() };
      state.tasks.unshift(task);
      if (reason) {
        state.approvals.unshift({ id: `${id}-approval`, taskId: id, robot, reason, status: "pending" });
        addLog(t("activityApproval"), wasRedacted);
      } else {
        addLog(t("activityRoute").replace("{robot}", robotName(robot)), wasRedacted);
      }
      persist();
      return task;
    }
    function handleDecision(approvalId, decision) {

      if (!approval) return;
      const task = state.tasks.find(item => item.id === approval.taskId);

      approval.status = decision;
      task.status = decision === "approved" ? "approved" : "rejected";
      addLog(t(decision === "approved" ? "activityApprove" : "activityReject").replace("{task}", task.text));
      persist();
      render();
    }

    function submitApp(form) {

      const details = String(data.get("details") || "").trim();
      if (!details) return showToast(t("emptyDetail"));
      const type = String(data.get("type") || "feature");
      const typeLabel = t(({ feature:"newFeature", bug:"bugFix", ui:"uiux", health:"healthCheck" })[type] || "newFeature");
      newTask(`${typeLabel}: ${details}`, "apps");
      devPrompt = `Work item: ${typeLabel}\nObjective: ${redact(details)}\nConstraints: preserve existing behavior, add focused validation, and report touched files and test results.`;
      form.reset();
      render();
    }
    function scanText(form) {
      const input = form.querySelector("#scan-text");
      const result = document.getElementById("scan-message");
      const unsafe = containsSensitive(input.value);
      input.value = "";
      result.innerHTML = `<div class="${unsafe ? "notice" : "safety-note"}">${esc(t(unsafe ? "scanWarning" : "scanClean"))}</div>`;
      input.focus();
    }
    document.addEventListener("click", event => {
      const langButton = event.target.closest("[data-lang]");
      if (langButton) {
        if (!LANGS.includes(langButton.dataset.lang)) return;
        state.lang = langButton.dataset.lang;
        persist();
        render();
        return;
      }
      const robotButton = event.target.closest("[data-robot]");
      if (robotButton) {
        if (!ROBOT_IDS.includes(robotButton.dataset.robot)) return;
        state.active = robotButton.dataset.robot;
        persist();
        render();
        return;
      }
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const action = button.dataset.action;
      if (action === "reset") {
        if (!window.confirm(t("resetConfirm"))) return;
        try {
          localStorage.removeItem(STORE_KEY);
          state = emptyState();
          generated = null;
          devPrompt = "";
          render();
        } catch (error) {
          console.error("Could not reset Clina demo state:", error);
          showToast(t("errorStorage"));
        }
      } else if (action === "approve" || action === "reject") {
        handleDecision(button.dataset.approval, action === "approve" ? "approved" : "rejected");
      } else if (action === "publish") {
        if (!generated) return showToast(t("emptyTopic"));
        newTask(`${t("requestPublish")}: ${generated.topic}`, "legend", "publish");
        render();
      } else if (action === "store-submit") {
        newTask(t("submission"), "release", "publish");
        render();
      } else if (action === "billing") {
        newTask(t("billing"), "release", "billing");
        render();
      } else if (action === "dev-prompt") {
        const details = document.getElementById("app-details").value.trim();
        if (!details) return showToast(t("emptyDetail"));
        devPrompt = `Objective: ${redact(details)}\nConstraints: preserve existing behavior, avoid unrelated changes, add focused validation, and report test results.`;
        render();
      } else if (action === "complete-task") {
        const task = state.tasks.find(item => item.id === button.dataset.task && item.status === "approved");
        if (!task) return;
        task.status = "complete";
        addLog(t("completedToast"));
        persist();
        showToast(t("completedToast"));
        render();
      }
    });
    document.addEventListener("submit", event => {
      const form = event.target;
      if (!(form instanceof HTMLFormElement)) return;
      event.preventDefault();
      if (form.id === "route-form") submitRoute(form);
      else if (form.id === "studio-form") submitStudio(form);
      else if (form.id === "app-form") submitApp(form);
      else if (form.id === "scan-form") scanText(form);
    });
    document.addEventListener("change", event => {
      const input = event.target.closest("[data-check]");
      if (!input) return;
      const group = input.dataset.check;
      const index = Number(input.dataset.index);
      if (!CHECKS[group] || !Number.isInteger(index) || index < 0 || index >= CHECKS[group].length) return;
      state.checks[group][index] = input.checked;
      persist();
      render();
    });
    loadState();
    render();
  </script>
</body>
</html>
